# Render Blueprint: the FinSignal research backend on Render's free plan.
#
# Free means: no card, 512 MB of memory, a fraction of one CPU, and 750
# instance hours a month per workspace, which covers one service running all
# month. A free service sleeps after 15 minutes without a request; the "Alert
# checks" GitHub Action calls it every ten minutes, which keeps it awake. Keep
# no other free service in the same workspace, or the two share those hours.
#
# The website (Vercel) reaches this service through its server-side proxy, and
# every request carries BACKEND_SHARED_KEY; any other caller is refused. The
# secrets are not declared here: after the Blueprint creates the service, paste
# the file `free_deploy.py env-files` writes (.env.render) into Environment →
# "Add from .env". See docs/FREE_DEPLOYMENT.md.
#
# The separate research-inference service this file used to declare is not
# needed: the backend reads the same committed model snapshot itself when
# QUANT_INFERENCE_URL is unset (src/services/inference_client.py).
services:
  - type: web
    name: finsignal-api
    runtime: docker
    plan: free
    # Next to Vercel's default function region (Washington, D.C.) and the US
    # market-data vendors.
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Liveness only, and the one path the shared key leaves open.
    healthCheckPath: /api/health
    autoDeploy: true
    # Rebuild only when what the image is built from changes, not on every
    # website commit: a free workspace has 500 build minutes a month.
    buildFilter:
      paths:
        - api/**
        - src/**
        - services/**
        - config/**
        - artifacts/**
        - experiments/**
        - data/manifests/**
        - data/research/**
        - requirements.txt
        - Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      # The 512 MB instance: the fixed, process-wide provider worker budget
      # (PROD-INCIDENT-001 in docs/incidents).
      - key: PROVIDER_CONCURRENCY_LIMIT
        value: "8"
